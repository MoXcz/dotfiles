# Colors come from the active theme; `theme apply` regenerates the source.
source = ~/.config/hypr/hyprlock-theme.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = $background
    blur_passes = 0
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $border
    inner_color = $surface
    font_color = $foreground
    check_color = $accent
    fail_color = $urgent
    fade_on_empty = false
    placeholder_text = <span foreground="##707880">Password</span>
    fail_text = <span foreground="##d27878">$FAIL</span>
    rounding = 8
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $foreground
    font_size = 64
    font_family = Iosevka Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = $muted
    font_size = 16
    font_family = Iosevka Nerd Font
    position = 0, 20
    halign = center
    valign = center
}
