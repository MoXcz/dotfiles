# Wait longer after a hotplug before applying a profile. It gives
# monitor-guard time to pause auto-switching for an unknown monitor
# before hyprmoncfgd disables it, and it avoids stacking modesets while a
# USB-C DisplayPort link is still training (the Intel driver has crashed on
# that on this laptop).
[Service]
ExecStart=
ExecStart=/usr/bin/hyprmoncfgd --debounce 3s
