general {
    lock_cmd = shell lock lock
    before_sleep_cmd = shell lock lock
    # Reapply the monitor layout after NVIDIA finishes resume link training.
    after_sleep_cmd = sleep 3 && hyprctl reload
    inhibit_sleep = 3
}

# Lock after 5 minutes.
listener {
    timeout = 300
    on-timeout = shell lock lock
}

# Explicit DPMS is disabled because NVIDIA can fault while modesetting on wake.
