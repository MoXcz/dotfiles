general.import = [ "~/.local/state/omarchy/current/theme/alacritty.toml" ]

[env]
TERM = "xterm-256color"

[font]
normal = { family = "IosevkaTerm Nerd Font Mono" }
bold = { family = "IosevkaTerm Nerd Font Mono" }
italic = { family = "IosevkaTerm Nerd Font Mono" }
size = 14

[window]
padding.x = 0
padding.y = 0
decorations = "None"


[terminal]
osc52 = "CopyPaste"

# Send Shift+Return as CSI-u so TUIs can distinguish it from Return without treating it as Alt+Return.
{ key = "Return", mods = "Shift", chars = "\u001B[13;2u" }
