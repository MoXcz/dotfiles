# Prefix
set -g prefix C-space
bind C-space send-prefix
# use for ssh-local workflows
# bind C-b send-prefix

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux-reloaded"

# General
set -g default-terminal "tmux-256color"
set -g mouse on # enable mouse use (e.g., resize panes)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000 # Increase scrollback buffer size from 2000 to 50000 lines
# change to 10 if something doesn't work
set -sg escape-time 0 # Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s focus-events on # Focus events enabled for terminals that support them
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on # Super useful when using "grouped sessions" and multi-monitor setup
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -s terminal-features "xterm-kitty:extkeys"
set -s terminal-features "*:RGB"
setw -g monitor-silence 0 # Do NOT reset the color of the tab after activity stops occuring
setw -g monitor-bell off # Disable bell
set -g display-time 2000 # Increase tmux messages display duration from 750ms to 2s

# vi mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# opencode keeps parallel sessions as its own tabs, so inside an agent popup
# the window keys drive those tabs (C-x is its leader, alt+up/down cycles tabs)
oc_tabs="#{&&:#{==:#{@popup},agent},#{==:#{pane_current_command},opencode}}"
in_agent="#{==:#{@popup},agent}"

# Pane Controls
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind C-p if -F "$oc_tabs" 'send-keys M-Up' previous-window
bind C-n if -F "$oc_tabs" 'send-keys M-Down' next-window
bind space last-window
# Shift Alt vim keys to switch windows
bind -n M-H if -F "$oc_tabs" 'send-keys M-Up' previous-window
bind -n M-L if -F "$oc_tabs" 'send-keys M-Down' next-window
bind b set-window-option synchronize-panes\; display-message "synchronize mode toggled."
# Splits and windows start at current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
# in an agent popup a new window starts the agent; '$AGENT' is expanded by the window's shell
bind c if -F "$oc_tabs" 'send-keys C-x n' {
  if -F "$in_agent" { new-window -c "#{pane_current_path}" '$AGENT' } { new-window -c "#{pane_current_path}" }
}
# Remove confirmation
bind & if -F "$oc_tabs" 'send-keys C-x w' kill-window
bind x kill-pane

# Set the title of the window to its default (change 'tmux a')
set -g set-titles on
set -g set-titles-string "#W"

if-shell '[ -z "$AGENT" ]' 'setenv -g AGENT claude'

# Status Bar
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{?#{m/r:^(claude|opencode)$,#{pane_current_command}},#{=24:pane_title},#{b:pane_current_command}}'
set -g status-left-length 40
set -g status-right-length 40

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]; "
set -g status-justify absolute-centre
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

bind i new-window cht.sh

bind o run-shell '~/.config/tmux/popup-run.sh agent "#{pane_current_path}" "#{session_name}" "#{client_name}" "$AGENT"'
# popup sessions carry @popup (set by popup-run.sh / popup-dev.sh)
bind s choose-tree -Zs -f '#{!:#{@popup}}'
bind S choose-tree -Zw -f '#{==:#{@popup},agent}' -F '#{pane_title}  #{pane_current_path}'
bind g run-shell "~/.config/tmux/popup-dev.sh '#{pane_current_path}'"

bind D display-menu -x C -y C -T "worktree" \
  "add"    a "popup -d '#{pane_current_path}' -w 50% -h 40% -E \"~/.config/tmux/worktree.sh add '#{client_name}'\"" \
  "open"   o "popup -d '#{pane_current_path}' -w 50% -h 40% -E \"~/.config/tmux/worktree.sh open '#{client_name}'\"" \
  "close"  c "popup -d '#{pane_current_path}' -w 50% -h 40% -E \"~/.config/tmux/worktree.sh close '#{client_name}'\"" \
  "remove" r "popup -d '#{pane_current_path}' -w 50% -h 40% -E \"~/.config/tmux/worktree.sh remove '#{client_name}'\"" \
  "quit"   q ""

vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -s terminal-features "*:clipboard"
