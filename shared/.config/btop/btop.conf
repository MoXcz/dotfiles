color_theme = "solitude"
theme_background = false
truecolor = true
force_tty = false

# Layout and navigation.
presets = "cpu:1:default,proc:0:default cpu:0:default,mem:0:default,net:0:default cpu:0:block,net:0:tty"
shown_boxes = "cpu mem net proc"
vim_keys = true
disable_mouse = false
rounded_corners = true
terminal_sync = true
graph_symbol = "braille"
update_ms = 2000

# Keep process names neutral and readable instead of fading down the list.
proc_sorting = "cpu lazy"
proc_reversed = false
proc_tree = false
proc_colors = false
proc_gradient = false
proc_per_core = false
proc_mem_bytes = true
proc_cpu_graphs = true
proc_info_smaps = false
proc_left = false
proc_filter_kernel = false
proc_follow_detailed = true
proc_aggregate = false

# Auto-detect hardware rather than tying the config to a specific machine.
cpu_graph_upper = "Auto"
cpu_graph_lower = "Auto"
show_gpu_info = "Auto"
cpu_invert_lower = true
cpu_single_graph = false
cpu_bottom = false
show_uptime = true
show_cpu_watts = true
check_temp = true
cpu_sensor = "Auto"
show_coretemp = true
temp_scale = "celsius"
base_10_sizes = false
show_cpu_freq = true
freq_mode = "first"
clock_format = "%X"
background_update = true

mem_graphs = true
mem_below_net = false
show_swap = true
swap_disk = true
show_disks = true
only_physical = true
use_fstab = true
show_io_stat = true
io_mode = false
io_graph_combined = false

net_download = 100
net_upload = 100
net_auto = true
net_sync = true
net_iface = ""
show_battery = true
selected_battery = "Auto"
show_battery_watts = true
log_level = "WARNING"

# Keep the tracked config stable. Make persistent edits in this file.
save_config_on_exit = false
